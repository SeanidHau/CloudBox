name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Check formatting
        run: |
          files="$(find . -name '*.go' -not -path './vendor/*')"
          test -z "$(gofmt -l $files)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build Docker image
        run: docker build --tag cloudbox:ci .