services:
  api:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DB_PATH: /data/cloudbox.db
      UPLOAD_DIR: /data/uploads
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      GIN_MODE: release
    volumes:
      - cloudbox-data:/data
    restart: unless-stopped

volumes:
  cloudbox-data: