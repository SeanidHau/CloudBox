services:
  api:
    build:
      context: .
    environment:
      HTTP_ADDR: ":8080"
      UPLOAD_DIR: /data/uploads
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}?sslmode=disable
      STORAGE_DRIVER: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-cloudbox}
      MINIO_USE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      GIN_MODE: release
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRASH_RETENTION_HOURS: ${TRASH_RETENTION_HOURS:-720}
      JOB_WORKER_COUNT: ${JOB_WORKER_COUNT:-1}
      JOB_POLL_INTERVAL_MILLISECONDS: ${JOB_POLL_INTERVAL_MILLISECONDS:-1000}
    volumes:
      - cloudbox-api-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
    environment:
      CLOUDBOX_DOMAIN: ${CLOUDBOX_DOMAIN:?set CLOUDBOX_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  cloudbox-api-data:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
